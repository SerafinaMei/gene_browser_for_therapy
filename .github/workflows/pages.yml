name: Deploy gene browser

on:
  push:
    branches: [main]
  schedule:
    # Tuesday after ClinVar's Monday release; GitHub schedules use UTC.
    - cron: '23 10 * * 2'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh ClinGen and ClinVar before publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install plot renderer
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: python3 -m pip install matplotlib==3.11.2
      - name: Refresh official clinical sources
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: python3 scripts/refresh_weekly.py --work-dir "$RUNNER_TEMP/clinical-refresh"
      - name: Check interface and settings
        run: node --test tests/*.test.mjs
      - name: Verify imported evidence
        run: |
          python3 tests/test_comprehensive.py
          python3 tests/test_clingen.py
          python3 tests/test_population.py
          python3 tests/test_omim.py
          python3 tests/test_dominant.py
      - name: Build website
        run: python3 scripts/prepare_hosting.py
      - name: Save validated weekly snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist data_sources
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly ClinGen and ClinVar evidence"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
